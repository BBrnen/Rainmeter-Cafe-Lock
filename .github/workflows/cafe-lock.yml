name: Build and test Cafe Lock

on:
  push:
    branches: [stage-3-cafe-lock, stage-4-maintenance]
  pull_request:
    branches: [main, stage-2-baseline-build, stage-3-cafe-lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cafe-lock-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source and history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Cafe Lock x64
        working-directory: Build
        shell: cmd
        run: Build.bat rainmeter-64 4.5.26.3894

      - name: Verify required binaries and x64 architecture
        shell: pwsh
        run: |
          foreach ($name in @('Rainmeter.exe', 'Rainmeter.dll', 'SkinInstaller.exe', 'RestartRainmeter.exe', 'RainmeterCafeMaintenance.exe')) {
            $path = Join-Path 'x64-Release' $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing build output: $path" }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x4550) { throw "Invalid PE file: $path" }
            if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw "Not an x64 binary: $path" }
          }
          @(
            'Official baseline: 5a124b6a09e2f7f67f8be9232718c489100e6173'
            "Build commit: $env:GITHUB_SHA"
            'Configuration: Release x64; Visual Studio 2022; upstream Build.bat'
            'Stage 4 review build: locked on startup; UAC Maintenance Mode. No installer.'
          ) | Set-Content x64-Release/CAFE-LOCK-BUILD.txt
          Get-ChildItem x64-Release -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/]Obj[\\/]' -and $_.Extension -in '.exe', '.dll' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetRelativePath((Resolve-Path 'x64-Release'), $_.Path))" } |
            Set-Content x64-Release/SHA256SUMS.txt

      - name: Test Cafe Lock policy
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /EHsc /W4 /WX /DNOMINMAX Tests\CafeLockPolicy.cpp /Fe:CafeLockPolicy.exe
          if errorlevel 1 exit /b 1
          CafeLockPolicy.exe

      - name: Test real maintenance authorization and reject forged clients
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /EHsc /W4 /WX /DNOMINMAX Tests\CafeAuthorization.cpp /Fe:CafeAuthorization.exe /link Advapi32.lib Shell32.lib Ole32.lib
          if errorlevel 1 exit /b 1
          CafeAuthorization.exe "%CD%\x64-Release\RainmeterCafeMaintenance.exe"

      - name: Exercise running Cafe Lock as a standard user
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /EHsc /W4 /WX Tests\RunAsStandard.cpp /Fe:RunAsStandard.exe /link Advapi32.lib Shlwapi.lib
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /W4 /WX Tests\CafeLaunchProbe.cpp /Fe:CafeLaunchProbe.exe /link Advapi32.lib /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File Tests\CafeLockSmoke.ps1 -Maintenance
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -Command "Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System | Select-Object EnableLUA,ConsentPromptBehaviorAdmin"
          RunAsStandard.exe "C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -File Tests\CafeLockSmoke.ps1 -StandardUser -ExpectElevationUnavailable

      - name: Upload Cafe Lock x64 review build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Rainmeter-Cafe-Lock-stage4-x64
          path: |
            x64-Release
            !x64-Release/Obj
          if-no-files-found: error
          retention-days: 30
