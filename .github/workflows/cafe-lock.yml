name: Build and test Cafe Lock

on:
  push:
    branches: [stage-3-cafe-lock, stage-4-maintenance, stage-5-installer, stage-6-compatibility]
  pull_request:
    branches: [main, stage-2-baseline-build, stage-3-cafe-lock, stage-4-maintenance, stage-5-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cafe-shelf-core:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out editor test sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test editor protocol and revocation
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File Tests\CafeShelfTests.ps1 -Suite All

      - name: Build manual drop diagnostic and verify its runner
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File Tests\CafeShelfDropProbe.ps1 -BuildOnly

      - name: Upload isolated drag-drop diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CafeShelf-drop-diagnostic
          path: work-package/CafeShelfDropKit/
          if-no-files-found: error
          retention-days: 14

  cafe-lock-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source and history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check pull-request diff whitespace
        shell: pwsh
        env:
          CAFE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "$env:CAFE_DIFF_BASE" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace errors in reviewed changes' }

      - name: Build Cafe Lock x64
        working-directory: Build
        shell: cmd
        run: Build.bat rainmeter-64 4.5.26.3894

      - name: Verify required binaries and x64 architecture
        shell: pwsh
        run: |
          foreach ($name in @('Rainmeter.exe', 'Rainmeter.dll', 'SkinInstaller.exe', 'RestartRainmeter.exe')) {
            $path = Join-Path 'x64-Release' $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing build output: $path" }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x4550) { throw "Invalid PE file: $path" }
            if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw "Not an x64 binary: $path" }
          }
          @(
            'Official baseline: 5a124b6a09e2f7f67f8be9232718c489100e6173'
            "Build commit: $env:GITHUB_SHA"
            'Configuration: Release x64; Visual Studio 2022; upstream Build.bat'
            'Stage 6 review build: password Maintenance Mode; dedicated x64 installer.'
          ) | Set-Content x64-Release/CAFE-LOCK-BUILD.txt
          Get-ChildItem x64-Release -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/]Obj[\\/]' -and $_.Extension -in '.exe', '.dll' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetRelativePath((Resolve-Path 'x64-Release'), $_.Path))" } |
            Set-Content x64-Release/SHA256SUMS.txt

      - name: Test Cafe Lock policy
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /EHsc /W4 /WX /DNOMINMAX Tests\CafeLockPolicy.cpp /Fe:CafeLockPolicy.exe
          if errorlevel 1 exit /b 1
          CafeLockPolicy.exe

      - name: Test password setup, verification, changes, persistence and launch policy
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /EHsc /W4 /WX /DNOMINMAX Tests\CafePassword.cpp /Fe:CafePassword.exe /link Bcrypt.lib
          if errorlevel 1 exit /b 1
          CafePassword.exe

      - name: Exercise running Cafe Lock as a standard user
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /EHsc /W4 /WX Tests\RunAsStandard.cpp /Fe:RunAsStandard.exe /link Advapi32.lib Shlwapi.lib
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /W4 /WX Tests\CafeLaunchProbe.cpp /Fe:CafeLaunchProbe.exe /link Advapi32.lib /SUBSYSTEM:WINDOWS
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File Tests\CafeLockSmoke.ps1 -Maintenance
          if errorlevel 1 exit /b 1
          RunAsStandard.exe "C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -File Tests\CafeLockSmoke.ps1 -StandardUser -Maintenance

      - name: Check out the pinned, unchanged ShelfSuite v2.1 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: MartinSantosT/ShelfSuite
          ref: d4f186ba0b5c262c7559b80841132f5fd3884f3c
          path: work-package/ShelfSuite
          persist-credentials: false

      - name: Test real ShelfSuite with a standard-user token
        shell: pwsh
        run: ./Tests/CafeShelfSuiteRunner.ps1 -ShelfSuiteDirectory work-package/ShelfSuite

      - name: Upload Cafe Lock x64 review build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Rainmeter-Cafe-Lock-stage6-x64
          path: |
            x64-Release
            !x64-Release/Obj
          if-no-files-found: error
          retention-days: 30

      - name: Install pinned NSIS and package Cafe Lock
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          ./Tests/CafeRuntimePolicy.ps1
          ./Build/CafeInstaller/Package.ps1

      - name: Test install, standard-user permissions, upgrade and uninstall
        shell: pwsh
        run: ./Tests/CafeInstaller.ps1

      - name: Upload installer, matching source and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Rainmeter-Cafe-Lock-stage6-installer-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
